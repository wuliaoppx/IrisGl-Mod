tasks.register('smoke', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.irisgl.test.SoftwareSmokeTest'
    args = ["${layout.buildDirectory.get().asFile}/smoke.png"]
    systemProperty 'irisgl.debug.raster', 'true'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

jar {
    manifest {
        attributes(
            'Implementation-Title': 'Antimony',
            'Implementation-Version': project.version,
            'MixinConfigs': 'antimony.mixins.json,antimony.gl.mixins.json'
        )
    }
}

// 可选：装进你自己的测试实例。默认关闭，只有显式给出路径才生效，
// 避免仓库里出现任何本机绝对路径。
//   gradle jar -PinstanceModsDir="D:/mc/.minecraft/versions/<版本>/mods"
tasks.register('deployToInstance', Copy) {
    def targetDir = providers.gradleProperty('instanceModsDir').map { file(it) }
    onlyIf { targetDir.present }
    dependsOn tasks.named('jar')
    doFirst {
        def dir = targetDir.get()
        dir.mkdirs()
        dir.listFiles()?.findAll { it.name ==~ /antimony-.*\.jar/ }?.each { it.delete() }
    }
    from tasks.named('jar').flatMap { it.archiveFile }
    into { targetDir.get() }
}
