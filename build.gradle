plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.modVersion
group = 'dev.antimony'
base { archivesName = 'antimony' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

neoForge {
    version = project.neoForgeVersion
    validateAccessTransformers = false

    runs {
        client {
            client()
            gameDirectory = file('run')
        }
    }

    mods {
        antimony {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

// Sodium 的配置 API 只用于把本模组的画质选项注册进 Sodium 设置页。
// Sodium 是第三方模组，二进制不随本仓库分发；构建前请从你自己的实例里取出：
//   unzip -o "<实例>/mods/sodium-*.jar" 'net/caffeinemc/mods/sodium/api/*' \
//         'net/caffeinemc/mods/sodium/client/config/*' -d /tmp/sodium-api
//   jar cf libs/sodium-api.jar -C /tmp/sodium-api .
// 或者直接用 -PsodiumApiJar=<路径> 指向现成的 jar。
def sodiumApiJar = file(providers.gradleProperty('sodiumApiJar').getOrElse("$rootDir/libs/sodium-api.jar"))
if (!sodiumApiJar.exists()) {
    throw new GradleException("""
        缺少 Sodium 配置 API 的编译期 jar: ${sodiumApiJar}
        Sodium 是第三方模组，本仓库不分发它的二进制。请从已安装的 Sodium 中提取
        net/caffeinemc/mods/sodium 下的类，打包成该文件；或用
        -PsodiumApiJar=<你的路径> 指定。该依赖仅 compileOnly，不会进最终模组 jar。
        """.stripIndent())
}

dependencies {
    // JNA 5.14.0 已包含在 Minecraft 运行时依赖里，这里只需要核心构件
    // （Win32 绑定在 dev.antimony.core.win32 中手写声明）。
    compileOnly 'net.java.dev.jna:jna:5.14.0'
    // Sodium 只提供编译期符号；运行时由实例里的真实 Sodium 提供，
    // 未安装 Sodium 时相关类永不加载。
    compileOnly files(sodiumApiJar)
}

// ---------------------------------------------------------------------------
// 数值回归探针：全部为纯 CPU 断言，不需要启动游戏。
// 少数需要“从游戏运行时抓下来的 shader 源”的探针，用 -Pcaptures=<目录> 指定。
// 默认 captures/ 不入库，见 .gitignore。
// ---------------------------------------------------------------------------
def captures = providers.gradleProperty('captures').getOrElse("$rootDir/captures")

['Default': null, 'On': 'on', 'Report': 'report', 'Off': 'off'].each { label, override ->
    tasks.register("glCompat${label}Probe", JavaExec) {
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'dev.antimony.gl.GlCompatModeProbe'
        args = [override == null ? 'ON' : override.toUpperCase(java.util.Locale.ROOT), override == null ? 'default' : 'explicit']
        if (override != null) systemProperty 'antimony.glcompat', override
    }
}

tasks.register('blockEntityInputsProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.antimony.gl.glsl.BlockEntityInputsProbe'
    args = ["$captures/block-entity"]
}

tasks.register('prepareCoverageProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.antimony.gl.glsl.PrepareCoverageProbe'
}

tasks.register('cpuFinalOutputProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.antimony.gl.glsl.CpuFinalOutputProbe'
}

tasks.register('postVertexSamplerProbe', JavaExec) {
