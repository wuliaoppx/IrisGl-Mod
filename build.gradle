tasks.register('sectionUpdateQueueProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.antimony.core.render.SectionUpdateQueueProbe'
}

tasks.register('cpuScreenImageProbe', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'dev.antimony.core.present.CpuScreenImageProbe'
